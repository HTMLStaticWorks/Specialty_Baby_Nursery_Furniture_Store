<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to your Nestora Baby Living account.">
    <title>Nestora Baby Living | Log In</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container { max-width: 450px; width: 100%; margin: 0 auto; background-color: var(--bg-tertiary); padding: 50px 40px; border-radius: var(--border-radius-md); box-shadow: var(--shadow-md); border: 1px solid var(--border-color); }
        .auth-wrapper { min-height: 100vh; display: flex; align-items: center; padding: 60px 0; background-color: var(--bg-secondary); position: relative; }
        .social-btn:hover { background-color: var(--bg-secondary) !important; transform: translateY(-2px); box-shadow: var(--shadow-sm); }
        .invalid-feedback { font-size: 0.85rem; color: #dc3545; }
        .form-label { font-weight: 500; font-size: 0.95rem; }
    </style>
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
</head>
<body>

    <main class="auth-wrapper">
        <div style="position: absolute; top: 20px; left: 0; right: 0; padding: 0 40px; display: flex; justify-content: flex-end; align-items: center; z-index: 10;">
            <div class="nav-controls d-flex gap-2">
                <button class="icon-btn" id="theme-toggle" aria-label="Toggle Dark Mode" style="background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: var(--text-primary); transition: all 0.3s; cursor: pointer;">
                    <i class="bi bi-moon-stars"></i>
                </button>
                <button class="icon-btn" id="rtl-toggle" aria-label="Toggle RTL" style="background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: var(--text-primary); transition: all 0.3s; cursor: pointer;">
                    <i class="bi bi-arrow-left-right"></i>
                </button>
            </div>
        </div>
        <div class="container">
            <div class="auth-container animate-fade-up">
                <div class="text-center mb-4">
                    <a href="index.html" class="navbar-brand text-decoration-none d-inline-flex align-items-center justify-content-center mb-3" style="font-size: 1.8rem; font-weight: 700; color: var(--text-primary);">
                        <svg class="brand-logo-icon me-2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width: 36px; height: 36px; color: var(--primary-color);">
                            <path fill="currentColor" d="M12 2a6 6 0 0 0-6 6v2H4v2h2v4a3 3 0 0 0-1 2.2V19a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-.8A3.01 3.01 0 0 0 11 16h2a3.01 3.01 0 0 0 2 2.2V19a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-.8a3 3 0 0 0-1-2.2v-4h2v-2h-2V8a6 6 0 0 0-6-6zm-4 8a4 4 0 0 1 8 0v2H8v-2zm-1 8a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm8 0a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/>
                        </svg>
                        Nestora
                    </a>
                    <h1 class="h3 font-heading mb-2">Welcome Back</h1>
                    <p class="text-secondary small">Log in to manage your orders and registry.</p>
                </div>
                
                <form id="loginForm" novalidate>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="custom-form-control" id="email" required placeholder="name@example.com">
                        <div class="invalid-feedback">Please enter a valid email.</div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="custom-form-control" id="password" required placeholder="••••••••">
                        <div class="invalid-feedback">Please enter your password.</div>
                    </div>
                    
                    <div class="mb-4 d-flex justify-content-between align-items-center">
                        <div class="form-check mb-0">
                            <input type="checkbox" class="form-check-input" id="rememberMe" style="border-color: var(--border-color); cursor: pointer;">
                            <label class="form-check-label small text-secondary" for="rememberMe" style="cursor: pointer; user-select: none;">Remember me</label>
                        </div>
                        <a href="#" class="text-sage small text-decoration-none" style="font-weight: 500;">Forgot Password?</a>
                    </div>
                    
                    <button type="submit" class="btn-primary-custom w-100 mb-4">Sign In</button>
                    
                    <div class="text-center my-3 position-relative">
                        <hr style="border-color: var(--border-color);">
                        <span style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--bg-tertiary); padding: 0 10px; font-size: 0.8rem; color: var(--text-secondary); font-weight: 500; white-space: nowrap;">OR CONTINUE WITH</span>
                    </div>
                    
                    <div class="d-flex justify-content-center gap-3 mb-4">
                        <button type="button" class="btn social-btn" aria-label="Login with Google" style="border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; transition: all 0.3s; border: 1px solid var(--border-color); color: var(--text-primary); background: transparent;">
                            <i class="bi bi-google"></i>
                        </button>
                        <button type="button" class="btn social-btn" aria-label="Login with Facebook" style="border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; transition: all 0.3s; border: 1px solid var(--border-color); color: var(--text-primary); background: transparent;">
                            <i class="bi bi-facebook"></i>
                        </button>
                        <button type="button" class="btn social-btn" aria-label="Login with Apple" style="border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; transition: all 0.3s; border: 1px solid var(--border-color); color: var(--text-primary); background: transparent;">
                            <i class="bi bi-apple"></i>
                        </button>
                    </div>
                    
                    <div class="text-center">
                        <p class="text-secondary small mb-0">Don't have an account? <a href="signup.html" class="text-sage fw-bold text-decoration-none">Sign Up</a></p>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        // Simple form validation
        document.getElementById('loginForm').addEventListener('submit', function (event) {
            if (!this.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
            }
            this.classList.add('was-validated');
        }, false);
    </script>
</body>
</html>
